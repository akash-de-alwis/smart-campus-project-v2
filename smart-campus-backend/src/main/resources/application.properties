spring.application.name=smart-campus-backend

# MongoDB local development connection
spring.mongodb.uri=mongodb://127.0.0.1:27017/smartcampus

# Google OAuth2 (exactly as in your client_secret.json)
spring.security.oauth2.client.registration.google.client-id=YOUR_GOOGLE_CLIENT_ID
spring.security.oauth2.client.registration.google.client-secret=YOUR_GOOGLE_CLIENT_SECRET
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8080/login/oauth2/code/google
spring.security.oauth2.client.provider.google.issuer-uri=https://accounts.google.com

server.port=8080

# File upload configuration
app.upload.dir=./uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging (helpful during development)
logging.level.org.springframework.security=DEBUG
logging.level.com.kavishka=DEBUG